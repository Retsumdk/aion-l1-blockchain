name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          # Find Python files and attempt compilation
          for f in $(find . -name "*.py" 2>/dev/null); do
            python -m py_compile "$f" 2>/dev/null && echo "Compiled: $f" || echo "Failed: $f"
          done
          if [ -z "$(find . -name '*.py' 2>/dev/null)" ]; then
            echo "No Python files to compile"
          fi